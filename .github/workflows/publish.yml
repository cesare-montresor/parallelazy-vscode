name: Publish Release

on:
  push:
    branches:
      - "release"

permissions:
  contents: write

jobs:
  release-build:
    runs-on: ubuntu-latest
    outputs:
      vsix_file: ${{ steps.build.outputs.vsix_file }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Required to check existing tags before building
          fetch-tags: true
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read version and check tag
        id: check_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          TAG_NAME="v$VERSION"

          echo "version=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "raw_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "::error::Tag $TAG_NAME already exists! Pipeline aborted to prevent duplicate publish."
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Build VSIX package
        id: build
        run: |
          mkdir -p dist
          VSIX_FILE="dist/${{ steps.check_version.outputs.name }}-${{ steps.check_version.outputs.raw_version }}.vsix"
          npx --yes @vscode/vsce package --out "$VSIX_FILE"
          echo "vsix_file=$VSIX_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and Tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_version.outputs.version }}
          name: Release ${{ steps.check_version.outputs.version }}
          generate_release_notes: true
          files: dist/*.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-vsix
          path: dist/

  vsce-publish:
    runs-on: ubuntu-latest
    needs: release-build
    environment:
      name: marketplace

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/download-artifact@v4
        with:
          name: release-vsix
          path: dist/

      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::notice::VSCE_PAT is not set; skipping Visual Studio Marketplace publish."
            exit 0
          fi
          npx --yes @vscode/vsce publish --packagePath "${{ needs.release-build.outputs.vsix_file }}" -p "$VSCE_PAT"

  openvsx-publish:
    runs-on: ubuntu-latest
    needs: release-build
    environment:
      name: openvsx

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/download-artifact@v4
        with:
          name: release-vsix
          path: dist/

      - name: Publish to Open VSX Registry
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::notice::OVSX_PAT is not set; skipping Open VSX Registry publish."
            exit 0
          fi
          npx --yes ovsx publish "${{ needs.release-build.outputs.vsix_file }}" -p "$OVSX_PAT"
